<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的显化花园</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#faf7f2', sage: '#a8b5a0', sageLight: '#d4dccf',
                        gold: '#c9b896', goldLight: '#e6ddd0', paper: '#fdfcf9', earth: '#8b7d6b',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'Noto Serif SC', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body{font-family:'Noto Serif SC','Playfair Display',serif}
        .paper-texture{background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E")}
        .soft-shadow{box-shadow:0 2px 10px rgba(168,181,160,.08),0 8px 24px rgba(168,181,160,.06)}
        .leaf-float{animation:float 8s ease-in-out infinite}
        .leaf-float-delay-1{animation:float 10s ease-in-out infinite;animation-delay:2s}
        .leaf-float-delay-2{animation:float 9s ease-in-out infinite;animation-delay:4s}
        .leaf-float-delay-3{animation:float 11s ease-in-out infinite;animation-delay:6s}
        @keyframes float{0%,100%{transform:translateY(0) rotate(0deg);opacity:.15}50%{transform:translateY(-15px) rotate(8deg);opacity:.25}}
        .bounce-click{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
        .bounce-click:active{transform:scale(.92)}
        .fade-in{animation:fadeIn .5s ease-out}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .slide-up{animation:slideUp .3s ease-out}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .counter-ring{width:200px;height:200px;border-radius:50%;background:conic-gradient(#a8b5a0 var(--pct,0%),#d4dccf var(--pct,0%));display:flex;align-items:center;justify-content:center;position:relative}
        .counter-ring::before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;background:#fdfcf9}
        .counter-ring .inner{position:relative;z-index:1;text-align:center}
        .timer-ring{width:240px;height:240px;border-radius:50%;background:conic-gradient(#a8b5a0 var(--timer-pct,100%),#d4dccf var(--timer-pct,100%));display:flex;align-items:center;justify-content:center;position:relative}
        .timer-ring::before{content:'';position:absolute;width:210px;height:210px;border-radius:50%;background:#fdfcf9}
        .timer-ring .inner{position:relative;z-index:1;text-align:center}
        .breathing{animation:breathe 4s ease-in-out infinite}
        @keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.05);opacity:1}}
        .vision-board{display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:80px;grid-auto-flow:dense;gap:8px;background:linear-gradient(135deg,rgba(168,181,160,.06),rgba(212,220,207,.1));border-radius:16px;padding:12px;min-height:800px;position:relative}
        .vision-board::before{content:'';position:absolute;inset:0;border-radius:16px;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 C32 15 38 20 45 22 C38 24 32 29 30 40 C28 29 22 24 15 22 C22 20 28 15 30 5Z' fill='rgba(168,181,160,0.03)'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
        .vision-block{border-radius:10px;overflow:hidden;position:relative;animation:blockDrop .4s cubic-bezier(.34,1.56,.64,1) forwards;opacity:0;cursor:grab;transition:box-shadow .2s,transform .2s;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;z-index:1}
        .vision-block:active{cursor:grabbing}
        .vision-block:hover{box-shadow:0 6px 24px rgba(0,0,0,.12);transform:translateY(-1px)}
        .vision-block.dragging{opacity:.6;z-index:100;box-shadow:0 12px 40px rgba(0,0,0,.25);transform:scale(1.03)}
        @keyframes blockDrop{0%{opacity:0;transform:translateY(-20px)}70%{opacity:1;transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}
        .vision-block img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
        .vision-block .block-tag{position:absolute;top:4px;left:4px;padding:2px 8px;border-radius:6px;font-size:10px;opacity:0;transition:opacity .2s;z-index:2;font-weight:500}
        .vision-block:hover .block-tag{opacity:1}
        .vision-block .del-block{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;opacity:0;transition:opacity .2s;cursor:pointer;z-index:2}
        .vision-block:hover .del-block{opacity:1}
        .vision-block .del-block:hover{background:rgba(220,38,38,.7)}
        .vision-block .resize-handle{position:absolute;bottom:0;right:0;width:24px;height:24px;cursor:nwse-resize;opacity:0;transition:opacity .2s;z-index:2;background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.3) 50%)}
        .vision-block:hover .resize-handle{opacity:1}
        .vision-block .resize-handle::after{content:'';position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-right:2px solid rgba(255,255,255,.7);border-bottom:2px solid rgba(255,255,255,.7)}
        .vision-block .resize-right{position:absolute;top:0;right:0;width:6px;height:100%;cursor:ew-resize;opacity:0;transition:opacity .2s;z-index:2}
        .vision-block:hover .resize-right{opacity:1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15))}
        .vision-block .resize-bottom{position:absolute;bottom:0;left:0;width:100%;height:6px;cursor:ns-resize;opacity:0;transition:opacity .2s;z-index:2}
        .vision-block:hover .resize-bottom{opacity:1;background:linear-gradient(180deg,transparent,rgba(255,255,255,.15))}
        .vision-block .img-overlay{position:absolute;bottom:0;left:0;right:0;top:0;display:flex;align-items:flex-end;padding:12px 10px 8px;background:linear-gradient(transparent 40%,rgba(0,0,0,.4));color:#fff;font-family:'Playfair Display','Noto Serif SC',serif;line-height:1.3;word-break:break-word;cursor:pointer;z-index:1;text-shadow:0 1px 4px rgba(0,0,0,.5)}
        .text-block{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;word-break:break-word;line-height:1.4;letter-spacing:.5px;height:100%;min-height:100%}
        .text-block .aff-ref{position:absolute;bottom:3px;right:6px;font-size:8px;opacity:.5;color:inherit}
        .vision-board .leaf-deco{position:absolute;font-size:14px;opacity:.08;pointer-events:none;z-index:0;animation:leafSway 6s ease-in-out infinite}
        @keyframes leafSway{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(8deg) translateY(-3px)}}
        .noise-btn.active{background:rgba(168,181,160,.25)!important;color:#8b7d6b!important;font-weight:500}
        @media(max-width:640px){.vision-board{grid-template-columns:repeat(4,1fr);grid-auto-rows:60px}}
        .aff-card{background:rgba(168,181,160,.06);border:1px solid rgba(168,181,160,.12);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:all .2s}
        .aff-card:hover{background:rgba(168,181,160,.12);border-color:rgba(168,181,160,.2)}
        .aff-card.dragging{opacity:.55;transform:scale(.98)}
        .aff-card.drag-over{border-color:rgba(168,181,160,.55);box-shadow:0 0 0 2px rgba(168,181,160,.2) inset}
        .vine-border{position:relative}
        .vine-border::before{content:'';position:absolute;top:-10px;left:-10px;right:-10px;bottom:-10px;border:1px solid rgba(168,181,160,.2);border-radius:24px;pointer-events:none}
        .sub-card{transition:all .3s ease}
        .sub-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(168,181,160,.12)}
        .confetti{position:fixed;width:8px;height:8px;border-radius:50%;opacity:0;animation:confetti-fall 4s ease-out forwards}
        @keyframes confetti-fall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
        .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
        .toast{padding:12px 20px;border-radius:12px;color:#fff;font-size:14px;animation:toastIn .3s ease-out,toastOut .3s ease-in 2.7s forwards;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:320px}
        .toast.success{background:linear-gradient(135deg,#a8b5a0,#8b9d82)}
        .toast.info{background:linear-gradient(135deg,#c9b896,#b5a47e)}
        .toast.warn{background:linear-gradient(135deg,#e8a87c,#d4915a)}
        @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
        @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease-out}
        .modal-box{background:#fdfcf9;border-radius:20px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .3s ease-out}
        .tab-btn{position:relative}
        .tab-btn.active::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:30px;height:3px;background:#a8b5a0;border-radius:2px}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#d4dccf;border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:#a8b5a0}
        .pulse-ring{position:absolute;border-radius:50%;border:2px solid #a8b5a0;animation:pulseRing .6s ease-out forwards;pointer-events:none}
        @keyframes pulseRing{0%{width:100%;height:100%;opacity:.8}100%{width:160%;height:160%;opacity:0}}
        .aff-progress{height:4px;border-radius:2px;background:#d4dccf;overflow:hidden;margin-top:6px}
        .aff-progress-bar{height:100%;border-radius:2px;transition:width .3s}
        .aff-card.selected{background:rgba(168,181,160,.18);border-color:rgba(168,181,160,.35)}
        .mini-player{position:fixed;bottom:20px;left:20px;z-index:8000;background:#fdfcf9;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.12);overflow:hidden;transition:all .3s}
        .mini-player.expanded{width:320px;height:180px}
        .mini-player.collapsed{width:48px;height:48px;border-radius:50%;cursor:pointer}
        .mini-player.collapsed:hover{transform:scale(1.1)}
        .mini-player iframe{width:100%;height:130px;border:none;border-radius:8px}
        .color-shift{animation:blockDrop .4s cubic-bezier(.34,1.56,.64,1) forwards,colorShift 12s ease-in-out .4s infinite}
        @keyframes colorShift{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(30deg)}}
        .float-counter{position:fixed;top:20px;right:20px;z-index:7000;background:#fdfcf9;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:12px 16px;user-select:none;transition:box-shadow .2s}
        .float-counter .fc-panel{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(168,181,160,.15)}
        .float-counter.expanded .fc-panel{display:block}
        .float-counter:hover{box-shadow:0 8px 30px rgba(0,0,0,.15)}
        .float-counter .fc-count{font-size:28px;font-weight:700;color:#8b7d6b}
        .float-counter .fc-label{font-size:10px;color:#a8b5a0}
        .float-counter .fc-btn{width:36px;height:36px;border-radius:50%;background:#a8b5a0;color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
        .float-counter .fc-btn:active{transform:scale(.9)}
        .float-counter .fc-expand{font-size:11px;color:#a8b5a0;cursor:pointer;margin-top:6px;text-align:center;padding:4px 0;border-radius:6px;transition:background .15s}
        .float-counter .fc-expand:hover{background:rgba(168,181,160,.1);color:#8b7d6b}
        .float-counter .fc-panel{margin-top:10px;padding-top:10px;border-top:1px solid rgba(168,181,160,.15)}
        .float-counter .fc-panel button{display:block;width:100%;text-align:left;padding:4px 8px;border-radius:6px;font-size:11px;color:#8b7d6b;background:none;border:none;cursor:pointer}
        .float-counter .fc-panel button:hover{background:rgba(168,181,160,.1)}
        .float-counter .fc-stats{display:flex;gap:8px;margin-top:6px}
        .float-counter .fc-stats span{font-size:10px;color:#a8b5a0}
        .float-meditation{position:fixed;bottom:20px;left:20px;z-index:7000;background:#fdfcf9;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:12px 16px;user-select:none;transition:box-shadow .2s}
        .float-meditation:hover{box-shadow:0 8px 30px rgba(0,0,0,.15)}
        .float-meditation .fm-panel{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(168,181,160,.15)}
        .float-meditation.expanded .fm-panel{display:block}
        .float-meditation .fm-time{font-size:24px;font-weight:700;color:#8b7d6b;font-family:'Playfair Display','Noto Serif SC',serif}
        .float-meditation .fm-label{font-size:10px;color:#a8b5a0}
        .float-meditation .fm-btn{width:36px;height:36px;border-radius:50%;background:#a8b5a0;color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
        .float-meditation .fm-btn:active{transform:scale(.9)}
        .float-meditation .fm-expand{font-size:11px;color:#a8b5a0;cursor:pointer;margin-top:6px;text-align:center;padding:4px 0;border-radius:6px;transition:background .15s}
        .float-meditation .fm-expand:hover{background:rgba(168,181,160,.1);color:#8b7d6b}
        .float-meditation button.fm-ctrl{padding:4px 10px;border-radius:8px;font-size:11px;border:none;cursor:pointer;transition:background .15s}
        .float-meditation .fm-noise-btn{padding:3px 8px;border-radius:6px;font-size:10px;border:none;cursor:pointer;background:rgba(168,181,160,.1);color:#8b7d6b;transition:all .15s}
        .float-meditation .fm-noise-btn.active{background:rgba(168,181,160,.25);color:#5b6d53;font-weight:500}
        .theme-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s}
        .theme-btn.active{border-color:#8b7d6b;box-shadow:0 0 0 2px rgba(139,125,107,.3)}
        .theme-bar{position:fixed;bottom:20px;right:20px;z-index:7001;display:flex;gap:6px;background:#fdfcf9;padding:8px 12px;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
        .sub-player-wrap{margin-top:8px;border-radius:8px;overflow:hidden;background:#000}
        .sub-player-wrap iframe{width:100%;height:180px;border:none}
        .hero-banner-wrap{position:relative;z-index:10;width:100vw;left:50%;transform:translateX(-50%);padding:0;margin:0 0 14px}
        .hero-banner{position:relative;width:100%;aspect-ratio:8/1;border-radius:0;overflow:hidden;background:linear-gradient(135deg,rgba(168,181,160,.55),rgba(212,220,207,.65),rgba(201,184,150,.55));border-top:1px solid rgba(168,181,160,.2);border-bottom:1px solid rgba(168,181,160,.2)}
        .hero-banner img{width:100%;height:100%;object-fit:cover;display:block}
        .hero-banner .hero-actions{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;z-index:2}
        .hero-banner .hero-btn{padding:6px 10px;border-radius:999px;font-size:12px;line-height:1;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer}
        .hero-banner .hero-btn:hover{background:rgba(0,0,0,.48)}
        .swatch-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
        .swatch-btn{width:100%;aspect-ratio:1/1;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
        .swatch-btn:hover{transform:translateY(-1px)}
        .swatch-btn.active{border-color:#8b7d6b;box-shadow:0 0 0 2px rgba(139,125,107,.25)}
    </style>
</head>
<body class="bg-cream paper-texture min-h-screen overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-16 left-8 text-sage leaf-float text-3xl"><i class="fa fa-leaf"></i></div>
        <div class="absolute top-32 right-12 text-sage leaf-float-delay-1 text-2xl"><i class="fa fa-leaf"></i></div>
        <div class="absolute bottom-40 left-16 text-sage leaf-float-delay-2 text-xl"><i class="fa fa-envira"></i></div>
        <div class="absolute bottom-24 right-20 text-sage leaf-float-delay-3 text-2xl"><i class="fa fa-leaf"></i></div>
        <div class="absolute top-1/2 left-4 text-sage leaf-float text-lg"><i class="fa fa-leaf"></i></div>
        <div class="absolute top-1/3 right-8 text-sage leaf-float-delay-1 text-lg"><i class="fa fa-envira"></i></div>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <div class="hero-banner-wrap">
        <div id="hero-banner" class="hero-banner soft-shadow">
            <img id="hero-banner-img" alt="花园顶部图片" class="hidden">
            <div class="hero-actions">
                <label class="hero-btn">更换图片<input type="file" id="hero-image-input" accept="image/*" class="hidden"></label>
                <button id="hero-image-reset" class="hero-btn">恢复默认</button>
            </div>
        </div>
    </div>
    <header class="py-6 md:py-8 text-center relative z-10">
        <h1 class="text-3xl md:text-5xl font-serif text-earth mb-3 tracking-wide">我的显化花园</h1>
        <p class="text-sage italic text-base md:text-lg font-light">"The universe is conspiring in your favor."</p>
    </header>
    <nav class="max-w-6xl mx-auto px-4 mb-3 md:mb-4 relative z-10">
        <div class="flex flex-wrap justify-center gap-2 md:gap-4">
            <button class="tab-btn active bg-paper soft-shadow px-3 md:px-4 py-1.5 md:py-2 rounded-lg border border-sage/10 text-sage transition-all duration-300 text-xs md:text-sm" data-tab="counter"><i class="fa fa-heart-o mr-1"></i>显化中心</button>
            <button class="tab-btn bg-paper soft-shadow px-3 md:px-4 py-1.5 md:py-2 rounded-lg border border-sage/10 text-earth hover:text-sage transition-all duration-300 text-xs md:text-sm" data-tab="vision"><i class="fa fa-picture-o mr-1"></i>愿景花园</button>
            <button class="tab-btn bg-paper soft-shadow px-3 md:px-4 py-1.5 md:py-2 rounded-lg border border-sage/10 text-earth hover:text-sage transition-all duration-300 text-xs md:text-sm" data-tab="subs"><i class="fa fa-headphones mr-1"></i>酥饼仓库</button>
            <button class="tab-btn bg-paper soft-shadow px-3 md:px-4 py-1.5 md:py-2 rounded-lg border border-sage/10 text-earth hover:text-sage transition-all duration-300 text-xs md:text-sm" data-tab="gratitude"><i class="fa fa-book mr-1"></i>感恩日记</button>
            <button class="tab-btn bg-paper soft-shadow px-3 md:px-4 py-1.5 md:py-2 rounded-lg border border-sage/10 text-earth hover:text-sage transition-all duration-300 text-xs md:text-sm" data-tab="knowledge"><i class="fa fa-bookmark-o mr-1"></i>显化知识库</button>
        </div>
    </nav>
    <!-- 浮动计数器 -->
    <div id="float-counter" class="float-counter">
        <div class="flex items-center gap-3">
            <button id="fc-btn" class="fc-btn"><i class="fa fa-heart"></i></button>
            <div>
                <div class="fc-count" id="fc-count">0</div>
                <div class="fc-label">今日 / <span id="fc-goal">108</span></div>
            </div>
        </div>
        <div class="fc-expand" id="fc-expand">▼ 更多</div>
        <div class="fc-panel" id="fc-panel">
            <div class="mb-2">
                <label class="text-[10px] text-sage block mb-1">点击累积到</label>
                <select id="fc-aff-select" class="w-full px-2 py-1 rounded-md border border-sage/20 bg-white/70 text-xs text-earth focus:outline-none focus:border-sage">
                    <option value="">不指定A句（仅总计）</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="text-[10px] text-sage block mb-1">浮动框大小: <span id="fc-size-val">100</span>%</label>
                <input type="range" id="fc-size" min="80" max="150" value="100" class="w-full accent-sage" style="height:4px">
            </div>
            <div class="fc-stats"><span>本周: <b id="fc-week">0</b></span><span>总计: <b id="fc-total">0</b></span></div>
            <button id="fc-set-goal"><i class="fa fa-bullseye mr-1"></i>设定目标</button>
            <button id="fc-reset"><i class="fa fa-refresh mr-1"></i>重置今日</button>
        </div>
    </div>
    <!-- 浮动静心时刻 -->
    <div id="float-meditation" class="float-meditation">
        <div class="flex items-center gap-3">
            <button id="fm-btn" class="fm-btn"><i class="fa fa-moon-o"></i></button>

    <script>
    // ===== 工具函数 =====
    function E(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

    // Toast 通知
    function toast(msg,type='success'){
        const c=document.getElementById('toast-container');
        const t=document.createElement('div');
        t.className=`toast ${type}`;t.textContent=msg;
        c.appendChild(t);setTimeout(()=>t.remove(),3000);
    }

    // 自定义确认弹窗（替代 confirm）
    function showConfirm(msg,cb){
        const o=document.createElement('div');o.className='modal-overlay';
        o.innerHTML=`<div class="modal-box"><p class="text-earth text-base mb-6">${E(msg)}</p><div class="flex justify-end gap-3"><button class="js-cancel px-5 py-2 bg-sageLight/30 text-earth rounded-lg text-sm">取消</button><button class="js-ok px-5 py-2 bg-sage text-white rounded-lg text-sm">确定</button></div></div>`;
        o.querySelector('.js-cancel').onclick=()=>o.remove();
        o.querySelector('.js-ok').onclick=()=>{o.remove();cb()};
        o.onclick=e=>{if(e.target===o)o.remove()};
        document.body.appendChild(o);
    }

    // 自定义输入弹窗（替代 prompt）
    function showPrompt(msg,defaultVal,cb){
        const o=document.createElement('div');o.className='modal-overlay';
        o.innerHTML=`<div class="modal-box"><p class="text-earth text-base mb-4">${E(msg)}</p><input type="text" class="js-input w-full px-4 py-2.5 rounded-lg border border-sage/20 focus:outline-none focus:border-sage bg-white/50 text-sm" value="${E(defaultVal||'')}"><div class="flex justify-end gap-3 mt-4"><button class="js-cancel px-5 py-2 bg-sageLight/30 text-earth rounded-lg text-sm">取消</button><button class="js-ok px-5 py-2 bg-sage text-white rounded-lg text-sm">确定</button></div></div>`;
        const inp=o.querySelector('.js-input');
        o.querySelector('.js-cancel').onclick=()=>o.remove();
        o.querySelector('.js-ok').onclick=()=>{const v=inp.value.trim();o.remove();cb(v)};
        inp.onkeydown=e=>{if(e.key==='Enter'){const v=inp.value.trim();o.remove();cb(v)}};
        o.onclick=e=>{if(e.target===o)o.remove()};
        document.body.appendChild(o);
        setTimeout(()=>inp.focus(),100);
    }

    // 数据导出/导入
    function exportData(){
        const d=localStorage.getItem('manifestation-garden')||'{}';
        const blob=new Blob([d],{type:'application/json'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);a.download=`显化花园_${new Date().toISOString().slice(0,10)}.json`;
        a.click();URL.revokeObjectURL(a.href);toast('数据已导出');
    }
    function importData(e){
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();r.onload=ev=>{
            try{
                const parsed=JSON.parse(ev.target.result);
                data={...data,...parsed};
                saveData();loadData();refreshAllViews();
                toast('数据已导入');
            }
            catch(err){toast('文件格式错误','warn')}
        };r.readAsText(f);
    }

    function refreshAllViews(){
        initTheme();
        renderCategories();renderAffirmations();updateRandomAffirmation();
        renderVisions();
        renderSubCategories();renderSubs();
        renderGratitudeTags();renderGratitude();
        renderKnowledgeCategories();renderKnowledge();
        initHeroBanner();
    }

    function resetAllData(){
        localStorage.removeItem('manifestation-garden');
        data={
            counter:{today:0,week:0,total:0,lastDate:'',lastWeek:'',goal:108},
            visions:defaultVisions.map((v,i)=>({id:Date.now()+i,...v})),affirmations:[],categories:['财富','事业','健康','关系','自我成长'],
            hiddenAffVisionIds:[],knowledge:[],subs:[],gratitude:[],selectedAff:null,theme:'sage',heroImage:''
        };
        saveData();loadData();refreshAllViews();
        toast('数据已清空');
    }

    // ===== 全局数据 =====
    let data={
        counter:{today:0,week:0,total:0,lastDate:'',lastWeek:'',goal:108},
        visions:[],affirmations:[],categories:['财富','事业','健康','关系','自我成长'],
        hiddenAffVisionIds:[],
        knowledge:[],
        subs:[],
        gratitude:[],
        selectedAff:null,
        heroImage:'',
        floatUI:{
            counter:{x:null,y:null,scale:1},
            meditation:{x:null,y:null,scale:1}
        }
    };
    const defaultVisions=[
        {type:'image',src:"https://picsum.photos/id/1067/400/300",category:'财富',cs:3,rs:2},
        {type:'image',src:"https://picsum.photos/id/180/400/400",category:'事业',cs:2,rs:2},
        {type:'image',src:"https://picsum.photos/id/1062/400/300",category:'健康',cs:3,rs:2},
        {type:'image',src:"https://picsum.photos/id/1036/400/400",category:'关系',cs:2,rs:2}
    ];
    let timerInterval,timerSeconds=300,timerTotal=300,timerRunning=false,currentGratitudeId=null;
    const themes={
        sage:{accent:'#a8b5a0',accentLight:'#d4dccf',bg:'#faf7f2',paper:'#fdfcf9',earth:'#8b7d6b'},
        rose:{accent:'#c9a0a0',accentLight:'#e6d0d0',bg:'#faf2f2',paper:'#fdf9f9',earth:'#8b6b6b'},
        ocean:{accent:'#8ba8b5',accentLight:'#cfdce6',bg:'#f2f7fa',paper:'#f9fcfd',earth:'#6b7d8b'},
        sunset:{accent:'#c9a870',accentLight:'#e6d8c0',bg:'#faf6f0',paper:'#fdfcf8',earth:'#8b7d5b'},
        lavender:{accent:'#a8a0c9',accentLight:'#d0cde6',bg:'#f5f2fa',paper:'#faf9fd',earth:'#7b6b8b'},
        forest:{accent:'#6b8f6b',accentLight:'#c0d4c0',bg:'#f2f7f2',paper:'#f9fdf9',earth:'#5b7d5b'}
    };
    const MORANDI_COLORS=['#d7c8b6','#c8c0b7','#bfc8be','#c7d0d8','#d2c7d6','#d8c9bf','#c7d2c3','#d9d4ca'];
    const DEFAULT_HERO_IMAGE='https://picsum.photos/id/1018/2400/300';

    // ===== 初始化 =====
    document.addEventListener('DOMContentLoaded',()=>{
        loadData();initTabs();initTheme();initCounter();initVisionBoard();initKnowledge();initAffirmations();initSubs();initGratitude();initTimer();initHeroBanner();updateRandomAffirmation();
        if(data.visions.length===0){
            defaultVisions.forEach((v,i)=>{data.visions.push({id:Date.now()+i,...v})});
            saveData();renderVisions();
        }
    });

    function saveData(){localStorage.setItem('manifestation-garden',JSON.stringify(data))}
    function loadData(){
        const s=localStorage.getItem('manifestation-garden');
        if(s){try{data={...data,...JSON.parse(s)}}catch(e){}}
        if(!data.counter)data.counter={today:0,week:0,total:0,lastDate:'',lastWeek:'',goal:108};
        if(!data.counter.goal)data.counter.goal=108;
        if(!data.selectedAff)data.selectedAff=null;
        if(!data.theme)data.theme='sage';
        if(!Array.isArray(data.hiddenAffVisionIds))data.hiddenAffVisionIds=[];
        if(!Array.isArray(data.knowledge))data.knowledge=[];
        if(!Array.isArray(data.subs))data.subs=[];
        if(typeof data.heroImage!=='string')data.heroImage='';
        if(!data.floatUI)data.floatUI={counter:{x:null,y:null,scale:1},meditation:{x:null,y:null,scale:1}};
        if(!data.floatUI.counter)data.floatUI.counter={x:null,y:null,scale:1};
        if(!data.floatUI.meditation)data.floatUI.meditation={x:null,y:null,scale:1};
        if(typeof data.floatUI.counter.scale!=='number')data.floatUI.counter.scale=1;

    function getWeekNumber(d){
        const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
        const day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-day);
        const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
        return Math.ceil((((dt-ys)/86400000)+1)/7);
    }

    const catColors={'财富':'#c9b896','事业':'#8b9d82','健康':'#7a8d72','关系':'#b5a47e','自我成长':'#9aab8f'};
    const textBlockColors=['#a8b5a0','#c9b896','#8b9d82','#b5a47e','#d4dccf','#7a8d72','#9aab8f','#b8c4a8'];
    const MAX_COL=8;
    const tagBg={'财富':'rgba(201,184,150,.85)','事业':'rgba(139,157,130,.85)','健康':'rgba(122,141,114,.85)','关系':'rgba(181,164,126,.85)','自我成长':'rgba(154,171,143,.85)'};

    function getCatColor(cat){return catColors[cat]||textBlockColors[Math.floor(Math.random()*textBlockColors.length)]}
    function getCatTagBg(cat){return tagBg[cat]||'rgba(168,181,160,.8)'}
    function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
    function hexToRgb(hex){
        if(!hex)return null;
        const s=hex.replace('#','').trim();
        if(s.length!==6)return null;
        const r=parseInt(s.slice(0,2),16),g=parseInt(s.slice(2,4),16),b=parseInt(s.slice(4,6),16);
        if(Number.isNaN(r)||Number.isNaN(g)||Number.isNaN(b))return null;
        return {r,g,b};
    }
    function rgbaToHex(color){
        const m=(color||'').match(/rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
        if(!m)return null;
        return '#'+[m[1],m[2],m[3]].map(v=>Number(v).toString(16).padStart(2,'0')).join('');
    }
    function buildRgba(baseColor,opacity){
        const rgb=hexToRgb(baseColor)||hexToRgb(getCatColor(''));
        const o=clamp(Number(opacity||1),0.1,1);
        return `rgba(${rgb.r},${rgb.g},${rgb.b},${o})`;
    }
    function getTextColorForBg(color){
        const m=(color||'').match(/rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
        const rgb=m?{r:+m[1],g:+m[2],b:+m[3]}:hexToRgb(color);
        if(!rgb)return '#fff';
        const lum=(0.299*rgb.r+0.587*rgb.g+0.114*rgb.b)/255;
        return lum>0.67?'#3f3a33':'#fff';
    }
    function ensureTextBlockVisual(v,cat){
        if(!v.baseColor){
            const fromRgba=rgbaToHex(v.color||'');
            v.baseColor=fromRgba||(/^#([0-9a-fA-F]{6})$/.test(v.color||'')?v.color:getCatColor(cat));
        }
        if(typeof v.opacity!=='number')v.opacity=0.92;
        v.opacity=clamp(v.opacity,0.1,1);
        v.color=buildRgba(v.baseColor,v.opacity);
    }

    function getSpanFromRatio(w,h){
        if(!w||!h)return{cs:2,rs:2};
        const r=w/h;
        if(r>2.5)return{cs:5,rs:2};      // 超宽横幅
        if(r>1.8)return{cs:4,rs:2};      // 宽横长方形
        if(r>1.3)return{cs:3,rs:2};      // 横长方形
        if(r>0.85)return{cs:2,rs:2};      // 正方形
        if(r>0.6)return{cs:2,rs:3};      // 竖长方形
        if(r>0.4)return{cs:2,rs:4};      // 窄竖条
        return{cs:2,rs:2};               // 默认正方形
    }

    function syncAffirmationsToVision(){
        // Remove affirmation blocks whose source affirmation no longer exists
        const affIds=new Set(data.affirmations.map(a=>a.id));
        data.visions=data.visions.filter(v=>v.type!=='affirmation'||affIds.has(v.id));
        // Add new affirmations that don't have a vision block yet
        const existingAffIds=new Set(data.visions.filter(v=>v.type==='affirmation').map(v=>v.id));
        const hiddenIds=new Set(data.hiddenAffVisionIds||[]);
        data.affirmations.forEach(a=>{
            if(hiddenIds.has(a.id))return;
            if(existingAffIds.has(a.id)){
                // Update text from source affirmation (user can still edit/delete the block)
                const existing=data.visions.find(v=>v.id===a.id);
                if(existing){existing.text=a.text;existing.category=a.category;ensureTextBlockVisual(existing,a.category)}
                return;
            }
            const cs=a.text.length>12?3:2,rs=2;
            const baseColor=getCatColor(a.category),opacity=.92;
            data.visions.push({id:a.id,type:'affirmation',text:a.text,cs,rs,baseColor,opacity,color:buildRgba(baseColor,opacity),category:a.category});
        });
    }

    function initKnowledgeDragResize(){
        if(typeof interact==='undefined')return;
        interact('.knowledge-block').unset();
        interact('.knowledge-block').draggable({
            inertia:false,
            ignoreFrom:'.resize-handle,.resize-right,.resize-bottom,.del-k,.edit-k,.block-tag,a',
            modifiers:[interact.modifiers.restrictRect({restriction:'parent',endOnly:true})],
            listeners:{
                start(e){e.target.classList.add('dragging');e.target.style.zIndex=100;e.target.setAttribute('data-dx',0);e.target.setAttribute('data-dy',0)},
                move(e){const dx=(parseFloat(e.target.getAttribute('data-dx'))||0)+e.dx;const dy=(parseFloat(e.target.getAttribute('data-dy'))||0)+e.dy;e.target.setAttribute('data-dx',dx);e.target.setAttribute('data-dy',dy);e.target.style.transform=`translate(${dx}px,${dy}px)`},
                end(e){
                    const id=parseInt(e.target.dataset.id);
                    const dx=parseFloat(e.target.getAttribute('data-dx'))||0;
                    const dy=parseFloat(e.target.getAttribute('data-dy'))||0;
                    e.target.setAttribute('data-dx',0);e.target.setAttribute('data-dy',0);e.target.style.transform='';e.target.classList.remove('dragging');e.target.style.zIndex='';
                    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
                    const board=document.getElementById('knowledge-board');
                    const blocks=[...board.querySelectorAll('.knowledge-block')];
                    const draggedIdx=data.knowledge.findIndex(v=>v.id===id);
                    if(draggedIdx<0)return;
                    const rect=e.target.getBoundingClientRect();
                    const cx=rect.left+rect.width/2+dx,cy=rect.top+rect.height/2+dy;
                    let targetIdx=-1;
                    for(let i=0;i<blocks.length;i++){
                        if(blocks[i]===e.target)continue;
                        const br=blocks[i].getBoundingClientRect();
                        if(cx>=br.left&&cx<=br.right&&cy>=br.top&&cy<=br.bottom){targetIdx=i;break}
                    }
                    if(targetIdx>=0){
                        const targetId=parseInt(blocks[targetIdx].dataset.id);
                        const targetDataIdx=data.knowledge.findIndex(v=>v.id===targetId);
                        if(targetDataIdx>=0&&targetDataIdx!==draggedIdx){
                            const [item]=data.knowledge.splice(draggedIdx,1);
                            const insertIdx=targetDataIdx>draggedIdx?targetDataIdx-1:targetDataIdx;
                            data.knowledge.splice(insertIdx,0,item);
                            saveData();renderKnowledge();
                        }
                    }
                }
            }
        });
        interact('.knowledge-block').resizable({
            edges:{left:false,right:'.resize-right',bottom:'.resize-bottom',top:false},
            inertia:false,
            listeners:{
                move(e){
                    const block=e.target,id=parseInt(block.dataset.id),v=data.knowledge.find(x=>x.id===id);if(!v)return;
                    const board=document.getElementById('knowledge-board');
                    const colW=board.clientWidth/MAX_COL;
                    const newCs=Math.max(1,Math.min(MAX_COL,Math.round(e.rect.width/colW)));
                    const newRs=Math.max(1,Math.round(e.rect.height/80));
                    block.style.gridColumn=`span ${newCs}`;block.style.gridRow=`span ${newRs}`;
                },
                end(e){
                    const block=e.target,id=parseInt(block.dataset.id),v=data.knowledge.find(x=>x.id===id);if(!v)return;
                    const board=document.getElementById('knowledge-board');
                    const colW=board.clientWidth/MAX_COL;
                    v.cs=Math.max(1,Math.min(MAX_COL,Math.round(e.rect.width/colW)));
                    v.rs=Math.max(1,Math.round(e.rect.height/80));
                    saveData();renderKnowledge();
                }
            }
        });
    }

        interact('.vision-block').draggable({
            inertia:false,
            ignoreFrom:'.resize-handle,.resize-right,.resize-bottom,.del-block,.edit-text,.block-tag,.img-overlay',
            modifiers:[interact.modifiers.restrictRect({restriction:'parent',endOnly:true})],
            listeners:{
                start(e){
                    e.target.classList.add('dragging');
                    e.target.style.zIndex=100;
                    e.target.setAttribute('data-dx',0);
                    e.target.setAttribute('data-dy',0);
                },
                move(e){
                    const dx=(parseFloat(e.target.getAttribute('data-dx'))||0)+e.dx;
                    const dy=(parseFloat(e.target.getAttribute('data-dy'))||0)+e.dy;
                    e.target.setAttribute('data-dx',dx);
                    e.target.setAttribute('data-dy',dy);
                    e.target.style.transform=`translate(${dx}px,${dy}px)`;
                },
                end(e){
                    const id=parseInt(e.target.dataset.id);
                    const dx=parseFloat(e.target.getAttribute('data-dx'))||0;
                    const dy=parseFloat(e.target.getAttribute('data-dy'))||0;
                    e.target.setAttribute('data-dx',0);
                    e.target.setAttribute('data-dy',0);
                    e.target.style.transform='';
                    e.target.classList.remove('dragging');
                    e.target.style.zIndex='';
                    // Only reorder if dragged a meaningful distance
                    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
                    const board=document.getElementById('vision-board');
                    const blocks=[...board.querySelectorAll('.vision-block')];
                    const draggedIdx=data.visions.findIndex(v=>v.id===id);
                    if(draggedIdx<0)return;
                    const rect=e.target.getBoundingClientRect();
                    const cx=rect.left+rect.width/2+dx;
                    const cy=rect.top+rect.height/2+dy;
                    let targetIdx=-1;
                    for(let i=0;i<blocks.length;i++){
                        if(blocks[i]===e.target)continue;
                        const br=blocks[i].getBoundingClientRect();
                        if(cx>=br.left&&cx<=br.right&&cy>=br.top&&cy<=br.bottom){targetIdx=i;break}
                    }
                    if(targetIdx>=0){
                        const targetId=parseInt(blocks[targetIdx].dataset.id);
                        const targetDataIdx=data.visions.findIndex(v=>v.id===targetId);
                        if(targetDataIdx>=0&&targetDataIdx!==draggedIdx){
                            const [item]=data.visions.splice(draggedIdx,1);
                            const insertIdx=targetDataIdx>draggedIdx?targetDataIdx-1:targetDataIdx;
                            data.visions.splice(insertIdx,0,item);
                            saveData();renderVisions();
                        }
                    }
                }
            }
        });
        // Resize by dragging right edge, bottom edge, or corner handle
        interact('.vision-block').resizable({
            edges:{left:false,right:'.resize-right',bottom:'.resize-bottom',top:false},
            inertia:false,
            modifiers:[],
            listeners:{
                start(e){
                    e.target.style.zIndex=50;
                },
                move(e){
                    const block=e.target;
                    const id=parseInt(block.dataset.id);
                    const v=data.visions.find(x=>x.id===id);
                    if(!v)return;
                    const board=document.getElementById('vision-board');
                    const colW=board.clientWidth/MAX_COL;
                    const newCs=Math.max(1,Math.min(MAX_COL,Math.round(e.rect.width/colW)));
                    const newRs=Math.max(1,Math.round(e.rect.height/80));
                    block.style.gridColumn=`span ${newCs}`;
                    block.style.gridRow=`span ${newRs}`;
                },
                end(e){
                    const block=e.target;
                    const id=parseInt(block.dataset.id);
                    const v=data.visions.find(x=>x.id===id);
                    if(!v)return;
                    const board=document.getElementById('vision-board');
                    const colW=board.clientWidth/MAX_COL;
                    const newCs=Math.max(1,Math.min(MAX_COL,Math.round(e.rect.width/colW)));
                    const newRs=Math.max(1,Math.round(e.rect.height/80));
                    v.cs=newCs;v.rs=newRs;
                    block.style.zIndex='';
                    saveData();renderVisions();
                }
            }
        });
    }

    function reorderAffirmations(dragId,targetId){
        if(!dragId||!targetId||dragId===targetId)return;
        const fromIdx=data.affirmations.findIndex(a=>a.id===dragId);
        const toIdx=data.affirmations.findIndex(a=>a.id===targetId);
        if(fromIdx<0||toIdx<0||fromIdx===toIdx)return;
        const [moved]=data.affirmations.splice(fromIdx,1);
        const insertIdx=toIdx>fromIdx?toIdx-1:toIdx;
        data.affirmations.splice(insertIdx,0,moved);
        saveData();
        renderAffirmations();
    }

        data.categories.forEach(cat=>{
            const btn=document.createElement('button');
            btn.className=`gra-filter-btn px-3 py-1.5 rounded-full text-sm ${graFilter===cat?'bg-sage/10 text-sage':'bg-sageLight/20 text-earth'}`;
            btn.textContent=cat;btn.dataset.filter=cat;
            btn.onclick=()=>{graFilter=cat;renderGratitudeTags();renderGratitude()};
            filterContainer.appendChild(btn);
        });
    }
    function renderGratitude(){
        const list=document.getElementById('gratitude-list');
        let items=graFilter==='all'?data.gratitude:data.gratitude.filter(x=>(x.tags||[]).includes(graFilter));
        if(!items.length){list.innerHTML='<div class="text-center text-sage py-12"><i class="fa fa-heart-o text-4xl mb-3 block opacity-20"></i><p>还没有感恩日记，开始记录美好吧 ✨</p></div>';return}
        list.innerHTML='';items.forEach(item=>{
            const div=document.createElement('div');
            div.className='bg-white/70 rounded-xl p-4 slide-up soft-shadow';
            const mood=item.mood||'🙏';
            const likes=item.likes||0;
            const tagsHtml=(item.tags||[]).map(t=>`<span class="px-2 py-0.5 text-[10px] rounded-full" style="background:${getCatTagBg(t)};color:#fff">${E(t)}</span>`).join('');
            div.innerHTML=`<div class="flex items-start gap-3"><div class="w-9 h-9 rounded-full bg-sage/15 flex items-center justify-center text-lg flex-shrink-0">${mood}</div><div class="flex-1 min-w-0"><div class="flex items-center justify-between mb-1"><span class="text-xs text-sage">${E(item.date)}</span><div class="flex gap-2"><button class="edit-gra text-sage/40 hover:text-earth text-xs"><i class="fa fa-pencil"></i></button><button class="del-gra text-sage/40 hover:text-red-400 text-xs"><i class="fa fa-trash-o"></i></button></div></div><p class="text-earth whitespace-pre-wrap text-sm leading-relaxed">${E(item.content)}</p>${tagsHtml?`<div class="flex flex-wrap gap-1 mt-2">${tagsHtml}</div>`:''}<div class="flex items-center gap-4 mt-3 pt-2 border-t border-sage/10"><button class="like-btn flex items-center gap-1 text-xs text-sage/50 hover:text-red-400 transition-colors"><i class="fa fa-heart-o"></i><span class="like-count">${likes}</span></button></div></div></div>`;
            div.querySelector('.edit-gra').onclick=()=>{
                currentGratitudeId=item.id;
                document.getElementById('gratitude-content').value=item.content;
                if(item.mood)document.getElementById('gratitude-mood').value=item.mood;
                graSelectedTags=(item.tags||[]).slice();renderGratitudeTags();
                document.getElementById('gratitude-content').focus();
            };
            div.querySelector('.del-gra').onclick=()=>showConfirm('删除这条日记？',()=>{data.gratitude=data.gratitude.filter(x=>x.id!==item.id);saveData();renderGratitude()});
            div.querySelector('.like-btn').onclick=function(){
                item.likes=(item.likes||0)+1;saveData();
                this.querySelector('.like-count').textContent=item.likes;
                this.querySelector('i').className='fa fa-heart';
                this.classList.add('text-red-400');this.classList.remove('text-sage/50');
            };
            list.appendChild(div);
        });
    }

    // ===== 静心计时器 + 白噪音 =====
    let noiseCtx=null,noiseSource=null,noiseGain=null,activeNoise=null;

    function startNoise(type){
        stopNoise();
        if(!noiseCtx)noiseCtx=new(window.AudioContext||window.webkitAudioContext)();
        const sr=noiseCtx.sampleRate,len=2*sr;
        const buf=noiseCtx.createBuffer(2,len,sr);
        // Generate noise
        for(let ch=0;ch<2;ch++){
            const d=buf.getChannelData(ch);
            for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
        }
        noiseSource=noiseCtx.createBufferSource();
        noiseSource.buffer=buf;noiseSource.loop=true;
        noiseGain=noiseCtx.createGain();
        const vol=document.getElementById('noise-volume').value/100;
        noiseGain.gain.value=vol*0.3;

        // Apply filter per type
        let filter;
        if(type==='rain'){
            filter=noiseCtx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=800;filter.Q.value=0.5;
        }else if(type==='ocean'){
            filter=noiseCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=400;filter.Q.value=0.7;
            // Add slow modulation
            const lfo=noiseCtx.createOscillator();lfo.frequency.value=0.1;
            const lfoGain=noiseCtx.createGain();lfoGain.gain.value=200;
            lfo.connect(lfoGain);lfoGain.connect(filter.frequency);lfo.start();
        }else if(type==='forest'){
            filter=noiseCtx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=2000;filter.Q.value=0.3;
        }else if(type==='fire'){
            filter=noiseCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=300;filter.Q.value=1;
        }else if(type==='wind'){
            filter=noiseCtx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=500;filter.Q.value=0.2;
        }else{
            filter=noiseCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1000;
        }
        noiseSource.connect(filter);filter.connect(noiseGain);noiseGain.connect(noiseCtx.destination);
        noiseSource.start();
        activeNoise=type;
        // Update button styles
        document.querySelectorAll('.noise-btn').forEach(b=>{
            b.classList.toggle('active',b.dataset.noise===type);
        });
    }
    function stopNoise(){
        if(noiseSource){try{noiseSource.stop()}catch(e){}noiseSource=null}
        activeNoise=null;
        document.querySelectorAll('.noise-btn').forEach(b=>b.classList.remove('active'));
    }

    function initTimer(){
        const fm=document.getElementById('float-meditation');
        const fmTime=document.getElementById('fm-time');
        const fmLabel=document.getElementById('fm-label');
        const fmExpand=document.getElementById('fm-expand');
        if(data.floatUI&&data.floatUI.meditation){
            const s=Math.max(.8,Math.min(1.5,Number(data.floatUI.meditation.scale)||1));
            fm.style.zoom=String(s);
            if(Number.isFinite(data.floatUI.meditation.x)&&Number.isFinite(data.floatUI.meditation.y)){
                fm.style.left=data.floatUI.meditation.x+'px';
                fm.style.top=data.floatUI.meditation.y+'px';
                fm.style.right='auto';
                fm.style.bottom='auto';
            }
            const fmSize=document.getElementById('fm-size');
            const fmSizeVal=document.getElementById('fm-size-val');
            if(fmSize&&fmSizeVal){
                fmSize.value=String(Math.round(s*100));
                fmSizeVal.textContent=String(Math.round(s*100));
                fmSize.oninput=()=>{
                    const pct=Math.max(80,Math.min(150,Number(fmSize.value)||100));
                    const ns=pct/100;
                    fm.style.zoom=String(ns);
                    fmSizeVal.textContent=String(pct);
                    data.floatUI.meditation.scale=ns;saveData();
                };
            }
        }
        const format=s=>{const m=Math.floor(s/60),ss=s%60;return `${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`};
        const updateView=()=>{fmTime.textContent=format(timerSeconds)};

        // Float meditation drag
        let fmDrag=false,fmX=0,fmY=0;
        fm.addEventListener('pointerdown',e=>{
            if(e.target.closest('.fm-btn')||e.target.closest('.fm-expand')||e.target.closest('.fm-panel'))return;
            fmDrag=true;fmX=e.clientX-fm.offsetLeft;fmY=e.clientY-fm.offsetTop;
            document.addEventListener('pointermove',fmMoveHandler);
            document.addEventListener('pointerup',fmUpHandler);
        });
        function fmMoveHandler(e){if(!fmDrag)return;fm.style.left=(e.clientX-fmX)+'px';fm.style.top=(e.clientY-fmY)+'px';fm.style.right='auto';fm.style.bottom='auto'}
        function fmUpHandler(){
            fmDrag=false;
            if(data.floatUI&&data.floatUI.meditation){
                data.floatUI.meditation.x=fm.offsetLeft;
                data.floatUI.meditation.y=fm.offsetTop;
                saveData();
            }
            document.removeEventListener('pointermove',fmMoveHandler);document.removeEventListener('pointerup',fmUpHandler)
        }

        // Expand/collapse
        fmExpand.onclick=()=>{
            fm.classList.toggle('expanded');
            fmExpand.textContent=fm.classList.contains('expanded')?'▲ 收起':'▼ 更多';
        };

        // Moon button = start/pause toggle
        const fmBtn=document.getElementById('fm-btn');
        fmBtn.onclick=()=>{
            if(timerRunning){
                clearInterval(timerInterval);timerRunning=false;fmLabel.textContent='已暂停';
                fmBtn.innerHTML='<i class="fa fa-moon-o"></i>';
            }else{
                timerRunning=true;fmLabel.textContent='冥想中...';
                fmBtn.innerHTML='<i class="fa fa-pause"></i>';
                if(noiseCtx&&noiseCtx.state==='suspended')noiseCtx.resume();
                timerInterval=setInterval(()=>{
                    if(timerSeconds>0){timerSeconds--;updateView()}
                    else{clearInterval(timerInterval);timerRunning=false;fmLabel.textContent='已完成 ✨';fmBtn.innerHTML='<i class="fa fa-moon-o"></i>';toast('静心结束 ✨','info');stopNoise()}
                },1000);
            }
        };

        // Noise buttons
        fm.querySelectorAll('.fm-noise-btn').forEach(btn=>{
            btn.onclick=()=>{
                if(activeNoise===btn.dataset.noise){stopNoise();btn.classList.remove('active');return}
                fm.querySelectorAll('.fm-noise-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                startNoise(btn.dataset.noise);
            };
        });
        document.getElementById('fm-volume').oninput=e=>{
            if(noiseGain)noiseGain.gain.value=e.target.value/100*0.3;
        };

        // Time pickers
        fm.querySelectorAll('.fm-ctrl[data-time]').forEach(btn=>{
            btn.onclick=()=>{
                const t=parseInt(btn.dataset.time);
                timerSeconds=t;timerTotal=t;clearInterval(timerInterval);timerRunning=false;updateView();
                fmLabel.textContent='准备开始';fmBtn.innerHTML='<i class="fa fa-moon-o"></i>';
            };
        });

        // Control buttons
        document.getElementById('fm-start').onclick=()=>{
            if(timerRunning)return;timerRunning=true;fmLabel.textContent='冥想中...';fmBtn.innerHTML='<i class="fa fa-pause"></i>';
            if(noiseCtx&&noiseCtx.state==='suspended')noiseCtx.resume();
            timerInterval=setInterval(()=>{
                if(timerSeconds>0){timerSeconds--;updateView()}
                else{clearInterval(timerInterval);timerRunning=false;fmLabel.textContent='已完成 ✨';fmBtn.innerHTML='<i class="fa fa-moon-o"></i>';toast('静心结束 ✨','info');stopNoise()}
            },1000);
        };
        document.getElementById('fm-pause').onclick=()=>{
            clearInterval(timerInterval);timerRunning=false;fmLabel.textContent='已暂停';fmBtn.innerHTML='<i class="fa fa-moon-o"></i>';
        };
        document.getElementById('fm-reset').onclick=()=>{
            clearInterval(timerInterval);timerRunning=false;timerSeconds=300;timerTotal=300;updateView();
            fmLabel.textContent='准备开始';fmBtn.innerHTML='<i class="fa fa-moon-o"></i>';stopNoise();
            fm.querySelectorAll('.fm-noise-btn').forEach(b=>b.classList.remove('active'));
        };
        updateView();
    }
    </script>
