<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的花园日记 · 安全同步版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #fafafa;
        }
        h1 {
            color: #2d8cf0;
            margin-bottom: 20px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 450px;
            padding: 20px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            background: white;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #save { background: #2d8cf0; color: white; }
        #load { background: #4CAF50; color: white; }
        .tip {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🌿 我的花园日记（安全同步版）</h1>
    <textarea id="text" placeholder="在这里写内容，保存后所有设备都会同步..."></textarea>

    <div class="btn-group">
        <button id="save" onclick="promptAndSave()">💾 保存到云端</button>
        <button id="load" onclick="loadFromCloud()">🔄 刷新最新内容</button>
    </div>

    <p class="tip">提示：Token 仅保存在你的浏览器中，不会泄露！</p>

    <script>
        // 只在这里填你的 Gist ID，Token 不再写进代码
        const GIST_ID = "f0dfa3a45adad6b4052441c36c5306f6";
        const FILE_NAME = "garden-data.txt";

        // 页面加载时自动读取
        window.onload = loadFromCloud;

        // 从云端读取（不需要 Token，公开 Gist 可直接读取）
        async function loadFromCloud() {
            try {
                let res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
                let data = await res.json();
                document.getElementById("text").value = data.files[FILE_NAME].content;
            } catch (e) {
                console.log("加载失败");
            }
        }

        // 保存时才输入 Token，不会泄露到代码里
        async function promptAndSave() {
            let token = prompt("请输入你的 GitHub Token（仅本次使用，不会保存）：");
            if (!token) return;

            let content = document.getElementById("text").value;
            try {
                await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: "PATCH",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        files: {
                            [FILE_NAME]: { content }
                        }
                    })
                });
                alert("✅ 保存成功！所有设备已同步！");
            } catch (e) {
                alert("❌ 保存失败，请检查 Token 是否正确");
            }
        }
    </script>
</body>
</html>
